<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ vacancy.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1>{{ vacancy.title }}</h1>

    <p><b>Компанія:</b> {{ vacancy.company }}</p>

    <p><b>Місто:</b> {{ vacancy.location }}</p>

    <p><b>Зарплата:</b> {{ vacancy.salary }}</p>

    <h3>Опис</h3>

    <p>{{ vacancy.description }}</p>

    {% if vacancy.source_url %}
        <p>
            <a href="{{ vacancy.source_url }}">
                Джерело вакансії
            </a>
        </p>
    {% endif %}

    <a class="btn btn-secondary"
       href="{% url 'vacancy_list' %}">
        Назад
    </a>

</div>

</body>
</html>
