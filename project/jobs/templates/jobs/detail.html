{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ job.title }}</title>
    <link rel="stylesheet" href="{% static 'jobs/style.css' %}">
</head>
<body>

<div class="card">
    <h1>{{ job.title }}</h1>

    <p><b>Компанія:</b> {{ job.company }}</p>
    <p><b>Зарплата:</b> {{ job.salary }}</p>
    <p>{{ job.description }}</p>

    <a class="btn" href="/">Назад</a>
</div>

</body>
</html>
